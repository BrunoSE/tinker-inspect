[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinker-inspect"
version = "0.4.0"
description = "Zero-dependency CLI and single-file HTML diagnostics viewer for Tinker RL runs and evaluation diffs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Bruno Stefoni" }]
keywords = ["tinker", "rl", "llm", "verifiers", "diagnostics", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BrunoSE/tinker-inspect"
Repository = "https://github.com/BrunoSE/tinker-inspect"
Documentation = "https://brunose.github.io/tinker-inspect/"

[project.scripts]
tinker-inspect = "tinker_inspect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tinker_inspect"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
